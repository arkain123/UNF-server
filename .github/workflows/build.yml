name: Build Cross-Platform Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: UNF-server-windows.exe
            asset_path: dist/main.exe
          - os: macos-latest
            artifact_name: UNF-server-macos
            asset_path: dist/main
          - os: ubuntu-latest
            artifact_name: UNF-server-linux
            asset_path: dist/main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --exclude-module config main.py

      - name: Rename output (Windows)
        if: runner.os == 'Windows'
        run: ren dist\main.exe server-windows.exe

      - name: Rename output (macOS/Linux)
        if: runner.os != 'Windows'
        run: mv dist/main server-${{ runner.os }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/server-windows.exe
            dist/server-Darwin
            dist/server-Linux
