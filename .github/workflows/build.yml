name: Build Cross-Platform Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: UNF-server-windows-x64
            binary_name: server-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: UNF-server-linux-x64
            binary_name: server-linux-x64
          - os: macos-latest
            artifact_name: UNF-server-macos-arm64
            binary_name: server-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --exclude-module config main.py

      - name: Rename binary (inside dist)
        shell: bash
        run: |
          if [ -f dist/main.exe ]; then
            mv dist/main.exe "dist/${{ matrix.binary_name }}"
          else
            mv dist/main "dist/${{ matrix.binary_name }}"
          fi

      - name: Verify binary exists
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error